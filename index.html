<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🛒 Mi Lista de Compras</h1>
        </header>

        <!-- Formulario para agregar productos -->
        <section class="form-container">
            <form id="purchase-form">
                <div class="form-group">
                    <label for="product-name">Producto:</label>
                    <input type="text" id="product-name" placeholder="Ej: Leche, Pan, Manzanas..." required>
                </div>

                <div class="form-group">
                    <label for="product-category">Categoría:</label>
                    <select id="product-category">
                        <option value="Almacén">Almacén</option>
                        <option value="Panadería">Panadería</option>
                        <option value="Lácteos">Lácteos</option>
                        <option value="Verdulería">Verdulería</option>
                        <option value="Carnicería">Carnicería</option>
                        <option value="Limpieza">Limpieza</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="product-quantity">Cantidad / Detalle:</label>
                    <input type="text" id="product-quantity" placeholder="Ej: 1 kg, 2 Litros, 1 paquete" required>
                </div>

                <button type="submit" id="add-btn">➕ Agregar a la Lista</button>
            </form>
        </section>

        <!-- Lista de productos agregados -->
        <section class="list-container">
            <h2>Lista de Compras</h2>
            <ul id="shopping-list">
                <!-- Los elementos ingresados se insertarán aquí dinámicamente con JavaScript -->
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
